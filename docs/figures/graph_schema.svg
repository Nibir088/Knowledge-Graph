<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <pattern id="swamp" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#bbf7d0"/><path d="M0,8 L8,0" stroke="#16a34a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>

  <!-- ===================== Panel A: landscape ===================== -->
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#111827">A. On the ground</text>
  <text x="30" y="58" font-size="13" fill="#4b5563">Every spot of land lies in one catchment; its runoff goes to that catchment's reach.</text>

  <!-- catchments -->
  <polygon points="40,80 300,70 330,330 60,340" fill="#f7fee7" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="300,70 640,90 620,330 330,330" fill="#fefce8" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="60,340 330,330 620,330 650,660 80,670" fill="#f0fdf4" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="104" font-size="13" font-weight="bold" fill="#3f6212">Catchment A</text>
  <text x="520" y="114" font-size="13" font-weight="bold" fill="#3f6212">Catchment B</text>
  <text x="90" y="655" font-size="13" font-weight="bold" fill="#3f6212">Catchment C</text>

  <!-- reservoir (start of reach B) -->
  <polygon points="545,118 600,122 596,160 550,156" fill="#38bdf8" stroke="#0369a1" stroke-width="1.2"/>
  <text x="604" y="146" font-size="12" fill="#0369a1">reservoir</text>
  <!-- on-network pond on reach B -->
  <ellipse cx="455" cy="228" rx="36" ry="20" fill="#7dd3fc" stroke="#0369a1" stroke-width="1.2"/>
  <text x="430" y="200" font-size="12" fill="#0369a1">pond (on stream)</text>

  <!-- reaches -->
  <path d="M150,120 C200,190 265,260 326,356" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#aw)"/>
  <path d="M572,160 C540,200 500,215 470,224" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M440,232 C415,255 380,320 334,356" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#aw)"/>
  <path d="M470,224 L440,232" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="4,3"/>
  <path d="M330,362 C350,450 400,520 458,618" fill="none" stroke="#1d4ed8" stroke-width="6" marker-end="url(#aw)"/>
  <!-- canal -->
  <path d="M170,470 L372,476" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#ao)"/>
  <text x="170" y="460" font-size="12" fill="#b45309">canal / ditch</text>
  <text x="128" y="150" font-size="12" fill="#1d4ed8" transform="rotate(50 128 150)">reach A</text>
  <text x="520" y="190" font-size="12" fill="#1d4ed8">reach B</text>
  <text x="404" y="420" font-size="12" fill="#1d4ed8">reach C</text>
  <text x="440" y="648" font-size="12" fill="#1d4ed8">→ downstream</text>
  <text x="250" y="352" font-size="12" fill="#1e3a8a">confluence</text>

  <!-- off-network pond in A -->
  <ellipse cx="104" cy="262" rx="28" ry="15" fill="#7dd3fc" stroke="#0369a1" stroke-width="1.2"/>
  <text x="70" y="292" font-size="12" fill="#0369a1">pond (off stream)</text>
  <path d="M132,258 C170,250 220,250 262,262" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ac)"/>

  <!-- swamp in C -->
  <ellipse cx="520" cy="520" rx="46" ry="24" fill="url(#swamp)" stroke="#16a34a" stroke-width="1.2"/>
  <text x="488" y="560" font-size="12" fill="#15803d">swamp</text>

  <!-- CAFO in A -->
  <rect x="200" y="120" width="70" height="9" fill="#9ca3af"/>
  <rect x="200" y="133" width="70" height="9" fill="#9ca3af"/>
  <rect x="200" y="146" width="70" height="9" fill="#9ca3af"/>
  <rect x="200" y="160" width="40" height="22" fill="#f9a8d4" stroke="#be185d" stroke-width="1"/>
  <rect x="190" y="112" width="92" height="76" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="190" y="104" font-size="13" font-weight="bold" fill="#ea580c">CAFO</text>
  <text x="244" y="178" font-size="10" fill="#be185d">lagoon</text>
  <path d="M236,188 C240,215 255,232 272,244" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="150" y="226" font-size="11" fill="#b45309">runoff when</text>
  <text x="150" y="239" font-size="11" fill="#b45309">it rains</text>

  <!-- industrial in B with outfall on reach B -->
  <circle cx="545" cy="282" r="13" fill="#ec4899" stroke="#111827" stroke-width="1"/>
  <text x="508" y="312" font-size="13" font-weight="bold" fill="#be185d">Industrial facility</text>
  <path d="M532,284 L404,292" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <circle cx="402" cy="292" r="6" fill="#22d3ee" stroke="#0e7490" stroke-width="1.5"/>
  <text x="408" y="280" font-size="11" fill="#0e7490">outfall</text>

  <!-- STP in C with outfall on reach C -->
  <circle cx="555" cy="430" r="15" fill="#3b82f6" stroke="#111827" stroke-width="1"/>
  <text x="482" y="465" font-size="13" font-weight="bold" fill="#1d4ed8">Sewage treatment plant</text>
  <path d="M540,432 L384,486" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <circle cx="381" cy="487" r="6" fill="#22d3ee" stroke="#0e7490" stroke-width="1.5"/>
  <text x="300" y="512" font-size="11" fill="#0e7490">outfall (pipe)</text>

  <!-- legend A -->
  <g font-size="12" fill="#374151">
    <rect x="30" y="690" width="630" height="78" fill="#f9fafb" stroke="#e5e7eb"/>
    <line x1="44" y1="708" x2="74" y2="708" stroke="#2563eb" stroke-width="4"/><text x="80" y="712">stream / river reach (arrow = flow direction)</text>
    <line x1="360" y1="708" x2="390" y2="708" stroke="#f59e0b" stroke-width="4"/><text x="396" y="712">canal / ditch</text>
    <line x1="44" y1="730" x2="74" y2="730" stroke="#65a30d" stroke-width="1.5" stroke-dasharray="6,4"/><text x="80" y="734">catchment boundary</text>
    <line x1="360" y1="730" x2="390" y2="730" stroke="#7c3aed" stroke-width="3" stroke-dasharray="4,3"/><text x="396" y="734">path through a pond</text>
    <line x1="44" y1="752" x2="74" y2="752" stroke="#0891b2" stroke-width="2.5"/><circle cx="74" cy="752" r="4" fill="#22d3ee"/><text x="80" y="756">pipe to discharge point (outfall)</text>
    <line x1="360" y1="752" x2="390" y2="752" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3"/><text x="396" y="756">runoff over land (rain-driven)</text>
  </g>

  <!-- divider -->
  <line x1="690" y1="20" x2="690" y2="760" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===================== Panel B: graph ===================== -->
  <text x="715" y="36" font-size="20" font-weight="bold" fill="#111827">B. In the knowledge graph</text>
  <text x="715" y="58" font-size="13" fill="#4b5563">Reach node = stream segment + its catchment (same NHDPlus ID).</text>

  <!-- edges first -->
  <g font-size="11" fill="#1e3a8a">
    <line x1="930" y1="232" x2="1020" y2="382" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="940" y="322" transform="rotate(59 940 322)">flows_to (f_e, Q_w, τ_e)</text>
    <line x1="1170" y1="232" x2="1072" y2="382" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="1108" y="300" transform="rotate(-57 1108 300)">flows_to</text>
    <line x1="905" y1="470" x2="1012" y2="428" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="912" y="485">flows_to</text>
    <line x1="1045" y1="448" x2="1045" y2="560" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="1053" y="530">flows_to → downstream reaches → outlet</text>
  </g>
  <g font-size="11">
    <line x1="808" y1="140" x2="882" y2="192" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ao)"/>
    <text x="800" y="186" fill="#b45309" transform="rotate(35 800 186)">drains_to (w)</text>
    <line x1="790" y1="152" x2="790" y2="222" stroke="#be185d" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="728" y="194" fill="#be185d">has_lagoon</text>
    <line x1="812" y1="238" x2="880" y2="218" stroke="#b45309" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ao)"/>
    <text x="826" y="218" fill="#b45309" transform="rotate(-16 826 218)">drains_to</text>
    <line x1="808" y1="320" x2="884" y2="232" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#ac)"/>
    <text x="842" y="318" fill="#0369a1" transform="rotate(-49 842 318)">drains_to (w)</text>
    <line x1="1180" y1="114" x2="1180" y2="182" stroke="#0369a1" stroke-width="1.8" marker-end="url(#ac)"/>
    <text x="1188" y="150" fill="#0369a1">pond_on_reach</text>
    <line x1="1310" y1="118" x2="1206" y2="190" stroke="#0369a1" stroke-width="1.8" marker-end="url(#ac)"/>
    <line x1="1318" y1="276" x2="1210" y2="222" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ac)"/>
    <text x="1232" y="236" fill="#0e7490">discharges_to</text>
    <text x="1232" y="250" fill="#0e7490">(via outfall)</text>
    <line x1="1262" y1="432" x2="1078" y2="414" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ac)"/>
    <text x="1120" y="440" fill="#0e7490">discharges_to (via outfall)</text>
    <line x1="1210" y1="560" x2="1078" y2="430" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="2,4"/>
  </g>

  <!-- reach nodes -->
  <g font-size="12" text-anchor="middle">
    <circle cx="905" cy="205" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="905" y="202" font-weight="bold" fill="#1e3a8a">Reach A</text><text x="905" y="217" fill="#1e3a8a" font-size="9">+ catchment</text>
    <circle cx="1180" cy="205" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="1180" y="202" font-weight="bold" fill="#1e3a8a">Reach B</text><text x="1180" y="217" fill="#1e3a8a" font-size="9">+ catchment</text>
    <circle cx="1045" cy="415" r="32" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="1045" y="412" font-weight="bold" fill="#1e3a8a">Reach C</text><text x="1045" y="427" fill="#1e3a8a" font-size="9">+ catchment</text>
    <circle cx="880" cy="478" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="880" y="476" font-weight="bold" fill="#92400e" font-size="11">Canal</text><text x="880" y="489" fill="#92400e" font-size="9">reach</text>
  </g>
  <!-- source and pond nodes -->
  <g font-size="12">
    <rect x="760" y="108" width="62" height="40" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="791" y="133" text-anchor="middle" font-weight="bold" fill="#c2410c">CAFO</text>
    <rect x="764" y="224" width="52" height="28" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
    <text x="790" y="243" text-anchor="middle" fill="#9d174d" font-size="11">Lagoon</text>
    <ellipse cx="790" cy="332" rx="40" ry="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
    <text x="790" y="330" text-anchor="middle" fill="#075985" font-size="11">Pond</text><text x="790" y="343" text-anchor="middle" fill="#075985" font-size="9">(off stream)</text>
    <ellipse cx="1180" cy="96" rx="44" ry="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
    <text x="1180" y="94" text-anchor="middle" fill="#075985" font-size="11">Pond</text><text x="1180" y="107" text-anchor="middle" fill="#075985" font-size="9">(on stream)</text>
    <ellipse cx="1325" cy="102" rx="48" ry="18" fill="#bae6fd" stroke="#0369a1" stroke-width="1.8"/>
    <text x="1325" y="106" text-anchor="middle" fill="#075985" font-size="11">Reservoir</text>
    <rect x="1290" y="262" width="92" height="40" rx="20" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="1336" y="280" text-anchor="middle" font-weight="bold" fill="#9d174d" font-size="11">Industrial</text><text x="1336" y="294" text-anchor="middle" fill="#9d174d" font-size="11">facility</text>
    <rect x="1262" y="412" width="112" height="40" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="1318" y="430" text-anchor="middle" font-weight="bold" fill="#1e3a8a" font-size="11">Sewage treatment</text><text x="1318" y="444" text-anchor="middle" fill="#1e3a8a" font-size="11">plant</text>
    <ellipse cx="1240" cy="570" rx="46" ry="18" fill="url(#swamp)" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="1240" y="574" text-anchor="middle" fill="#14532d" font-size="11">Swamp</text>
    <text x="1180" y="602" fill="#15803d" font-size="10">left out by default (outdated in NHD)</text>
  </g>


  <!-- region nodes -->
  <g font-size="11">
    <line x1="1016" y1="428" x2="842" y2="548" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
    <text x="930" y="512" fill="#4b5563" transform="rotate(-34 930 512)">in_region</text>
    <line x1="862" y1="495" x2="812" y2="545" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
    <rect x="726" y="548" width="116" height="30" rx="3" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="784" y="567" text-anchor="middle" font-weight="bold" fill="#111827">HUC12 (region)</text>
    <line x1="842" y1="563" x2="900" y2="563" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="846" y="555" fill="#4b5563" font-size="10">part_of</text>
    <rect x="902" y="548" width="58" height="30" rx="3" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="931" y="567" text-anchor="middle" font-weight="bold" fill="#111827">HUC8</text>
    <text x="966" y="567" fill="#4b5563">→ HUC4 → state</text>
    <text x="726" y="596" fill="#4b5563" font-size="10">every node is in_region of one HUC12 (sources, ponds, reaches); HUC12 drains_to HUC12 (WBD)</text>
  </g>
  <!-- notes B -->
  <g font-size="12" fill="#374151">
    <rect x="712" y="620" width="670" height="148" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="726" y="642" font-weight="bold">Reach attributes</text>
    <text x="726" y="660">length, stream order, flow Q, velocity v, travel time τ; from its catchment: area, storm rain (Stage IV),</text>
    <text x="726" y="676">design storm R_u (Atlas 14), floodplain share (FEMA SFHA)</text>
    <text x="726" y="700" font-weight="bold">Edges</text>
    <text x="726" y="718">flows_to: reach → reach (NHDPlus, given) · drains_to: land source → reach of its catchment (weight = area share)</text>
    <text x="726" y="736">discharges_to: plant / facility → reach at its outfall · pond_on_reach: the reach runs through the pond</text>
    <text x="726" y="754">has_lagoon: CAFO → lagoon · CAFO and lagoons have no pipe: they reach water only via runoff, overflow, seepage</text>
  </g>
</svg>
